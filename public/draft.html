<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Board · Fantasy Hoops</title>
<meta name="description" content="The live draft board for our fantasy basketball league.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/draft.css">
</head>
<body>
<header class="bar">
  <a class="mark" href="/">Fantasy Hoops <span id="season"></span></a>
  <div class="status" id="status"></div>
  <div class="side">
    <select class="me" id="me" aria-label="Who are you?"></select>
    <button class="gbtn" id="gradeBtn" hidden>Grades</button>
    <div class="sync" id="sync"><i></i><span>Connecting</span></div>
  </div>
</header>
<div class="wrap"><div class="board" id="board"></div></div>
<div class="toast" id="toast"></div>
<div class="grades" id="grades"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/guide-data.js"></script>
<script>
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const board = document.getElementById("board"), statusBox = document.getElementById("status"), sync = document.getElementById("sync"), toast = document.getElementById("toast");
// Add ?year=2026 to the address to look at a finished draft from an earlier season.
const year = new URLSearchParams(location.search).get("year");
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;

let cells = null, heads = null, shape = null, made = -1, clockFrom = null, last = null;

// ESPN's official headshot. Players without one (some rookies) just show no picture.
const headshot = (id, width) => {
  const img = el("img", "head");
  img.src = `https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${id}.png&w=${width}&h=${Math.round(width * .727)}`;
  img.alt = "";
  img.onerror = () => img.remove();
  return img;
};

// Draft grades come from playing the season out. Each team's roster (its picks so far, with the
// rest of the draft filled in by the guide's rankings) is run through thousands of simulated
// seasons using the guide's points-per-game and games-played projections and the league's own
// lineup size, schedule length and playoff format. The grade is how often a team wins the title.
// Only for the current season, since the guide is this season's.
const guide = year ? null : window.GUIDE;
const curve = guide && guide.players.map(p => p.total).sort((a, b) => b - a);
const rankOf = guide && new Map(guide.players.map(p => [p.id, p.rank]));
const worth = n => curve[Math.min(n, curve.length) - 1];
// How far a pick landed from the guide's ranking: +12 means taken 12 spots later than ranked (a steal).
const gap = p => rankOf && rankOf.has(p.player.id) ? p.n - rankOf.get(p.player.id) : null;
const verdict = p => { const g = gap(p); return g == null ? "not in the guide" : `guide #${rankOf.get(p.player.id)}` + (g >= 8 ? " · steal" : g <= -8 ? " · reach" : ""); };
// Title odds to a letter. With ten teams an average roster wins about 10% of the time.
const LETTERS = [[25, "A+"], [19, "A"], [15, "A-"], [12, "B+"], [9.5, "B"], [7.5, "B-"], [5.5, "C+"], [4, "C"], [2.5, "C-"], [1.2, "D"], [-1, "F"]];
const SIMS = 1000, NOISE = .3, GAMES_PER_DAY = 3.45 / 7;
const gradeBtn = document.getElementById("gradeBtn"), gradeBox = document.getElementById("grades");
let chips = {}, projs = {}, letters = {}, announced = null, gradesOpen = false, sim = null, asked = null, openWhenReady = false;

// Small repeatable random-number generator, so everyone watching sees the same numbers for the same picks.
function dice(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// Runs in a background worker (see below), so it only uses what it is handed.
function simulate(d, players) {
  const byId = new Map(players.map(p => [p.id, p]));
  const L = d.league || {}, starters = L.starters || 10, weeks = L.weeks || 19, T = d.order.length;
  const spots = Math.min(L.playoffTeams || 7, T), rounds = Math.ceil(Math.log2(spots)), total = weeks + rounds;
  const col = Object.fromEntries(d.order.map((t, i) => [t.id, i]));
  // Rosters: real picks, then the best players left in guide order for every pick not made yet.
  const taken = new Set(d.picks.filter(p => p.player).map(p => p.player.id));
  const left = players.filter(p => !taken.has(p.id)), filler = players[players.length - 1];
  let next = 0;
  const rosters = d.order.map(() => []);
  d.picks.forEach(p => rosters[col[p.teamId]].push(p.player ? byId.get(p.player.id) || filler : left[next++] || filler));
  // Best players first: on a crowded night the lineup takes the top ones and the rest sit.
  rosters.forEach(r => r.sort((x, y) => y.ppg - x.ppg));
  const ppg = rosters.map(r => r.map(p => p.ppg)), plays = rosters.map(r => r.map(p => Math.min(1, p.gp / 82) * GAMES_PER_DAY));
  // When a player's team plays but he is out, a free pickup fills in only some of the time.
  const pickup = d.replacement || 0, covered = d.covered || 0;

  const rand = dice(20270000 + taken.size), score = rosters.map(() => new Float64Array(total));
  const wins = new Float64Array(T), playoffs = new Float64Array(T), titles = new Float64Array(T), points = new Float64Array(T);
  const order = d.order.map((_, i) => i), w = new Float64Array(T), pf = new Float64Array(T);
  const spot = (j, k) => j === 0 ? order[0] : order[1 + (j - 1 + k) % (T - 1)];
  for (let n = 0; n < SIMS; n++) {
    // Every team's score for every week: each day, each player either plays or not, and scores around his average.
    for (let t = 0; t < T; t++) {
      const pp = ppg[t], pl = plays[t], size = pp.length, sc = score[t];
      for (let k = 0; k < total; k++) {
        let sum = 0;
        for (let day = 0; day < 7; day++) {
          let used = 0;
          for (let i = 0; i < size && used < starters; i++) {
            const roll = rand();
            if (roll < pl[i]) { used++; sum += pp[i] * (1 + NOISE * 2 * (rand() + rand() + rand() - 1.5)); }
            else if (roll < GAMES_PER_DAY && rand() < covered) { used++; sum += pickup * (1 + NOISE * 2 * (rand() + rand() + rand() - 1.5)); }
          }
        }
        sc[k] = sum;
      }
    }
    // Regular season: a shuffled round-robin, one matchup a week.
    for (let i = T - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)), x = order[i]; order[i] = order[j]; order[j] = x; }
    w.fill(0); pf.fill(0);
    for (let k = 0; k < weeks; k++) {
      for (let i = 0; i < T >> 1; i++) {
        const x = spot(i, k), y = spot(T - 1 - i, k);
        if (score[x][k] >= score[y][k]) w[x]++; else w[y]++;
        pf[x] += score[x][k]; pf[y] += score[y][k];
      }
    }
    for (let t = 0; t < T; t++) { wins[t] += w[t]; points[t] += pf[t] / weeks; }
    // Playoffs: best records get in, top seed gets the bye when the field is odd, one week a round.
    let alive = d.order.map((_, i) => i).sort((x, y) => w[y] - w[x] || pf[y] - pf[x]).slice(0, spots);
    alive.forEach(t => playoffs[t]++);
    const seed = Object.fromEntries(alive.map((t, i) => [t, i]));
    for (let r = 0; alive.length > 1; r++) {
      const k = weeks + r, through = alive.length % 2 ? [alive[0]] : [], rest = alive.length % 2 ? alive.slice(1) : alive;
      for (let i = 0; i < rest.length >> 1; i++) { const x = rest[i], y = rest[rest.length - 1 - i]; through.push(score[x][k] >= score[y][k] ? x : y); }
      alive = through.sort((x, y) => seed[x] - seed[y]);
    }
    titles[alive[0]]++;
  }
  return { weeks, results: Object.fromEntries(d.order.map((t, i) => [t.id, { wins: wins[i] / SIMS, playoffs: 100 * playoffs[i] / SIMS, title: 100 * titles[i] / SIMS, points: points[i] / SIMS }])) };
}

// The simulation takes a moment, so it runs off to the side and the board never freezes waiting for it.
const simWorker = guide && new Worker(URL.createObjectURL(new Blob([
  `const SIMS=${SIMS},NOISE=${NOISE},GAMES_PER_DAY=${GAMES_PER_DAY};${dice};${simulate};onmessage=e=>postMessage({key:e.data.key,...simulate(e.data.d,e.data.players)})`])));
const picksKey = d => d.picks.map(p => p.player ? p.player.id : 0).join();
if (simWorker) simWorker.onmessage = e => {
  sim = e.data;
  if (!last || picksKey(last) !== sim.key) return;
  showGrades(last);
  if (openWhenReady) { openWhenReady = false; toggleGrades(true); }
};

function grade(d) {
  return d.order.map(t => {
    const r = sim.results[t.id];
    const picks = d.picks.filter(p => p.teamId === t.id && p.player).map(p => { const rank = rankOf.get(p.player.id) || curve.length; return { ...p, rank, value: worth(rank) - worth(p.n) }; });
    return { ...t, ...r, picks, letter: LETTERS.find(([floor]) => r.title >= floor)[1],
      steal: picks.length ? picks.reduce((x, y) => y.value > x.value ? y : x) : null,
      reach: picks.length ? picks.reduce((x, y) => y.value < x.value ? y : x) : null };
  }).sort((x, y) => y.title - x.title);
}

function showGrades(d) {
  // One simulation per new pick. Until its result comes back, the grades already showing stay up.
  const key = picksKey(d);
  if (!sim || sim.key !== key) {
    if (asked !== key) {
      asked = key;
      simWorker.postMessage({ key, d: { order: d.order, picks: d.picks, league: d.league, replacement: guide.replacement, covered: guide.covered }, players: guide.players.map(p => ({ id: p.id, ppg: p.ppg, gp: p.gp })) });
    }
    return;
  }
  const count = d.picks.filter(p => p.player).length, pct = n => n >= 99.5 ? ">99%" : n < .5 ? "<1%" : Math.round(n) + "%";
  const teams = grade(d);
  teams.forEach(t => {
    chips[t.id].textContent = count ? t.letter : "";
    projs[t.id].textContent = count ? `${t.wins.toFixed(1)}-${(sim.weeks - t.wins).toFixed(1)} · title ${pct(t.title)}` : "";
    // When a pick moves a team's grade, pop the letter and say so in the pick announcement.
    const before = letters[t.id];
    if (count && before && before !== t.letter) {
      gsap.fromTo(chips[t.id], { scale: 2.2, color: "#fff" }, { scale: 1, color: "", duration: still ? 0 : 1.2, ease: "elastic.out(1,.5)", clearProps: "all" });
      if (announced && announced.teamId === t.id && Date.now() - announced.at < 6000) announced.line.textContent += ` · grade ${before} → ${t.letter}`;
    }
    letters[t.id] = t.letter;
  });
  gradeBtn.hidden = !count;

  const pick = p => `${p.player.name} at ${p.round}.${String(p.slot).padStart(2, "0")}` + (rankOf.has(p.player.id) ? ` (ranked ${p.rank})` : " (not in the guide)");
  const box = el("div", "grades-in"), head = el("div", "line"), cols = el("div", "grow ghead");
  head.append(el("b", null, d.drafted ? "Draft grades" : "Draft grades so far"),
    el("small", null, `${SIMS.toLocaleString("en-US")} simulated seasons` + (d.drafted ? "" : " · rest of the draft filled in from the guide") + " · click to close"));
  cols.append(el("span"), el("span"), el("span", null, "Record"), el("span", null, "Playoffs"), el("span", null, "Title"));
  box.append(head, cols);
  teams.forEach(t => {
    const row = el("div", t.owner === me ? "grow mine" : "grow"), text = el("div");
    text.append(el("b", null, t.owner));
    if (t.steal) text.append(el("p", null, "Best value: " + pick(t.steal)));
    if (t.reach && t.reach.value < 0 && t.reach !== t.steal) text.append(el("p", null, "Biggest reach: " + pick(t.reach)));
    row.append(el("span", "letter", t.letter), text, el("span", "pts", `${t.wins.toFixed(1)}-${(sim.weeks - t.wins).toFixed(1)}`), el("span", "pts", pct(t.playoffs)), el("span", "pts gold", pct(t.title)));
    box.append(row);
  });
  gradeBox.replaceChildren(box);
}

function toggleGrades(show) {
  gradesOpen = show;
  gsap.to(gradeBox, { autoAlpha: show ? 1 : 0, duration: still ? 0 : .3 });
  if (show) gsap.from(gradeBox.querySelectorAll(".grow"), { opacity: 0, y: 20, duration: still ? 0 : .4, stagger: still ? 0 : .05, ease: "power2.out" });
}
gradeBtn.addEventListener("click", () => toggleGrades(!gradesOpen));
gradeBox.addEventListener("click", () => toggleGrades(false));

// "Who are you?": no passwords, just a name remembered on this device so your own team stands out.
const meBox = document.getElementById("me");
let me = null;
try { me = localStorage.getItem("draftMe"); } catch (e) {}
meBox.addEventListener("change", () => {
  me = meBox.value || null;
  try { me ? localStorage.setItem("draftMe", me) : localStorage.removeItem("draftMe"); } catch (e) {}
  if (last) render(last);
});

const setSync = (cls, text) => { sync.className = "sync " + cls; sync.lastElementChild.textContent = text; };

function build(d) {
  const rounds = Math.max(...d.picks.map(p => p.round));
  board.style.setProperty("--teams", d.order.length);
  board.style.setProperty("--rounds", rounds);
  heads = {};
  board.replaceChildren();
  d.order.forEach(t => {
    const h = el("div", "team");
    chips[t.id] = el("i", "chip");
    projs[t.id] = el("span", "proj");
    h.append(chips[t.id], el("b", null, t.owner), el("span", null, t.team), projs[t.id]);
    heads[t.id] = h;
    board.append(h);
  });
  meBox.replaceChildren(new Option("Who are you?", ""), ...d.order.map(t => new Option(t.owner, t.owner)));
  meBox.value = d.order.some(t => t.owner === me) ? me : "";
  cells = {};
  const column = Object.fromEntries(d.order.map((t, i) => [t.id, i + 1]));
  d.picks.forEach(p => {
    const c = el("div", "cell");
    c.style.gridColumn = column[p.teamId];
    c.style.gridRow = p.round + 1;
    cells[p.n] = c;
    board.append(c);
  });
  document.getElementById("season").textContent = `· ${d.year - 1}-${String(d.year).slice(2)} draft`;
}

function fill(cell, p) {
  const label = `${p.round}.${String(p.slot).padStart(2, "0")}`;
  if (!p.player) { cell.className = "cell"; delete cell.dataset.player; cell.replaceChildren(el("span", "num", label)); return; }
  const words = p.player.name.split(" ");
  cell.className = "cell picked " + p.player.pos;
  if (cell.dataset.player == p.player.id) return;
  cell.dataset.player = p.player.id;
  const meta = el("span", "meta", [p.player.pos, p.player.team].filter(Boolean).join(" · ")), g = rankOf ? gap(p) : 0;
  if (g) meta.append(el("i", g > 0 ? "up" : "down", (g > 0 ? " +" : " −") + Math.abs(g)));
  else if (g == null) meta.append(el("i", "down", " NR"));
  cell.replaceChildren(headshot(p.player.id, 200), el("span", "num", label), meta,
    el("span", "first", words[0]), el("b", null, words.slice(1).join(" ") || words[0]));
}

function announce(p, owner) {
  const words = el("div");
  const line = el("small", null, `${owner} selects · pick ${p.n}`);
  announced = { teamId: p.teamId, line, at: Date.now() };
  words.append(line, el("b", null, p.player.name), el("span", null, [p.player.pos, p.player.team, rankOf && verdict(p)].filter(Boolean).join(" · ")));
  toast.replaceChildren(headshot(p.player.id, 350), words);
  gsap.killTweensOf(toast);
  gsap.timeline()
    .fromTo(toast, { autoAlpha: 0, y: 60, scale: .9 }, { autoAlpha: 1, y: 0, scale: 1, duration: still ? 0 : .5, ease: "back.out(1.6)" })
    .to(toast, { autoAlpha: 0, y: 30, duration: still ? 0 : .4, ease: "power2.in" }, "+=4.5");
}

function showStatus() {
  if (!last) return;
  const d = last, next = d.picks.find(p => !p.player), count = d.picks.filter(p => p.player).length;
  statusBox.replaceChildren();
  if (d.drafted || !next) { statusBox.append("Draft complete"); return; }
  if (!d.inProgress) {
    // The start time is read from ESPN on every check, so a rescheduled draft shows its new time.
    if (count) statusBox.append("Draft paused");
    else if (d.starts && d.starts > Date.now()) statusBox.append("Draft starts " + new Date(d.starts).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
    else statusBox.append("Waiting for the draft to start");
    return;
  }
  const owner = d.order.find(t => t.id === next.teamId);
  statusBox.append(owner && owner.owner === me ? "You're on the clock" : "On the clock: " + (owner ? owner.owner : ""), el("small", null, `Round ${next.round} · pick ${next.slot}`));
  // ESPN does not share its pick clock or say when the commissioner pauses, so this countdown
  // starts when the board sees the previous pick arrive and uses ESPN's current seconds-per-pick.
  // If it runs out and still no pick comes, the draft is paused or ESPN is slow: say so rather than sit at 0:00.
  if (clockFrom && d.seconds) {
    const left = Math.ceil(d.seconds - (Date.now() - clockFrom) / 1000);
    if (left < -8) statusBox.append(el("small", "clock low", "Waiting on ESPN"));
    else statusBox.append(el("span", "clock" + (left <= 10 ? " low" : ""), `${Math.floor(Math.max(0, left) / 60)}:${String(Math.max(0, left) % 60).padStart(2, "0")}`));
  }
}

function render(d) {
  // Rebuild the grid if the draft order, team names or number of rounds changed since it was drawn.
  const nowShape = JSON.stringify([d.order, d.picks.map(p => p.teamId)]);
  const redrawn = nowShape !== shape;
  if (redrawn) { build(d); shape = nowShape; }
  const count = d.picks.filter(p => p.player).length, next = d.inProgress ? d.picks.find(p => !p.player) : null;
  d.picks.forEach(p => {
    const wasPicked = cells[p.n].classList.contains("picked");
    fill(cells[p.n], p);
    if (p.player && !wasPicked && made >= 0 && !redrawn) gsap.from(cells[p.n], { scale: .6, opacity: 0, duration: still ? 0 : .6, ease: "back.out(2)" });
  });
  const mine = d.order.find(t => t.owner === me);
  Object.entries(heads).forEach(([id, h]) => { h.classList.remove("now"); h.classList.toggle("mine", !!mine && mine.id == id); });
  if (mine) d.picks.forEach(p => p.teamId === mine.id && cells[p.n].classList.add("mine"));
  if (next) { cells[next.n].classList.add("now"); heads[next.teamId]?.classList.add("now"); }
  if (made < 0) {
    // First look at the board: pick up the clock remembered from before a page reload, or for
    // the very first pick, count from the draft's start time.
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("draftClock")); } catch (e) {}
    if (next && saved && saved.year === d.year && saved.count === count) clockFrom = saved.at;
    else if (next && count === 0 && d.starts && Date.now() >= d.starts && Date.now() - d.starts < d.seconds * 1000) clockFrom = d.starts;
  } else if (count !== made) {
    // A new pick restarts the clock. So does a pick the commissioner took back.
    if (count > made) {
      const newest = d.picks.filter(p => p.player).pop();
      announce(newest, d.order.find(t => t.id === newest.teamId)?.owner || "");
    }
    clockFrom = Date.now();
  } else if (last && d.inProgress && !last.inProgress) {
    // The draft just started, or was resumed after a pause.
    clockFrom = Date.now();
  }
  // When the watcher inside ESPN's draft room is reporting, use ESPN's real clock instead of our estimate.
  if (d.clockLeft != null) clockFrom = Date.now() - (d.seconds * 1000 - d.clockLeft);
  if (!d.inProgress) clockFrom = null;
  if (curve) {
    // Put the final grades up by themselves the moment the draft finishes.
    if (last && d.drafted && !last.drafted) openWhenReady = true;
    showGrades(d);
    if (openWhenReady && sim && sim.key === picksKey(d)) { openWhenReady = false; toggleGrades(true); }
  }
  try { clockFrom ? localStorage.setItem("draftClock", JSON.stringify({ year: d.year, count, at: clockFrom })) : localStorage.removeItem("draftClock"); } catch (e) {}
  made = count;
  last = d;
  showStatus();
}

async function refresh() {
  let wait = 2000;
  try {
    const r = await fetch("/api/draft" + (year ? "?year=" + encodeURIComponent(year) : ""), { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    render(d);
    if (d.drafted) { setSync("", "Final"); return; }
    if (!d.inProgress && d.starts - Date.now() > 3600000) wait = 30000;
    setSync("live", d.inProgress ? "Live" : "Synced with ESPN");
  } catch (e) {
    setSync("down", "Reconnecting");
    if (!cells) board.replaceChildren(el("p", "note", e.message || "Could not load the draft."));
    wait = 6000;
  }
  setTimeout(refresh, wait);
}
refresh();
setInterval(showStatus, 1000);
</script>
</body>
</html>
