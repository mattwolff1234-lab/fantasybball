<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Scheduling</title>
<meta name="description" content="Pick every time you can make the fantasy basketball draft.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bar"><div>
  <h1>Draft Scheduling</h1>
  <p class="sub">Fantasy Basketball · 10 teams · tap every time you can make · all times ET</p>
</div></div>
<main>
  <section class="panel">
    <div>
      <label for="name">Your name</label>
      <input type="text" id="name" maxlength="24" autocomplete="off">
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="panel" id="actions">
    <div class="row">
      <button class="btn" id="confirm" type="button">Confirm</button>
      <span class="note" id="msg" role="status"></span>
    </div>
  </section>
</main>

<script src="/slots.js"></script>
<script>
const { days, hr, valid } = window.DRAFT;
const $ = id => document.getElementById(id);
let mine = new Set();
try { const s = JSON.parse(localStorage.getItem("draft-picks") || "{}");
  mine = new Set((s.slots || []).filter(x => valid.has(x))); $("name").value = s.name || ""; } catch (e) {}
const save = () => { try { localStorage.setItem("draft-picks",
  JSON.stringify({ name: $("name").value, slots: [...mine] })); } catch (e) {} };

const wrap = $("days");
days.forEach(d => {
  const row = document.createElement("div"); row.className = "day";
  const nm = document.createElement("div"); nm.className = "dname"; nm.textContent = d.dow;
  const sm = document.createElement("small"); sm.textContent = d.label; nm.appendChild(sm);
  const chips = document.createElement("div"); chips.className = "chips";
  d.hours.forEach(h => {
    const id = d.key + "-" + h;
    const b = document.createElement("button"); b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", mine.has(id));
    const t = document.createElement("span"); t.className = "t"; t.textContent = hr(h); b.appendChild(t);
    b.onclick = () => { mine.has(id) ? mine.delete(id) : mine.add(id);
      b.setAttribute("aria-pressed", mine.has(id)); save(); $("msg").textContent = ""; };
    chips.appendChild(b);
  });
  row.append(nm, chips); wrap.appendChild(row);
});
$("name").oninput = save;

$("confirm").onclick = async () => {
  const name = $("name").value.trim(), msg = $("msg");
  msg.className = "note";
  if (!name) { msg.textContent = "Add your name first."; $("name").focus(); return; }
  if (!mine.size) { msg.textContent = "Pick at least one time."; return; }
  $("confirm").disabled = true; msg.textContent = "Saving...";
  try {
    const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, slots: [...mine] }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Save failed");
    msg.className = "note done";
    msg.textContent = "You're in. Change your picks and hit Confirm again anytime.";
  } catch (e) {
    msg.className = "note err";
    msg.textContent = "Couldn't save your picks. Check your connection and try again.";
  } finally { $("confirm").disabled = false; }
};
</script>
</body>
</html>
