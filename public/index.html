<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Scheduling</title>
<meta name="description" content="Pick every time you can make the fantasy basketball draft.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bar"><div>
  <h1>Draft Scheduling</h1>
  <p class="sub">Pick every time you can make · all times ET</p>
</div></div>
<div class="dock" id="dock"><div>
  <div class="status">
    <b id="count"></b>
    <span class="note" id="msg" role="status"></span>
  </div>
  <button class="btn" id="confirm" type="button">Confirm</button>
</div></div>
<main id="picker">
  <section class="panel">
    <div>
      <label for="name">Your name</label>
      <input type="text" id="name" maxlength="24" autocomplete="off" autocapitalize="words" list="roster">
      <datalist id="roster"></datalist>
      <div class="fielderr" id="nameErr" role="alert" hidden></div>
    </div>
  </section>

  <section class="panel">
    <div>
      <p class="lbl">Quick picks</p>
      <div class="quick" id="quick"></div>
    </div>
    <p class="note">Then fine-tune below. Tap a time, or swipe across a row to grab several.</p>
  </section>

  <section class="panel days" id="days">
    <p class="leadkey" id="leadKey" hidden>★ Most picked so far. Prioritize these if you can.</p>
  </section>
</main>

<main id="after" hidden>
  <section class="panel">
    <h2>Top times so far</h2>
    <span class="note" id="inCount" role="status"></span>
    <ul class="best" id="best"></ul>
  </section>
  <section class="panel">
    <div class="row"><button class="btn quiet" id="edit" type="button">Change my picks</button></div>
  </section>
</main>

<script src="/slots.js"></script>
<script type="module">
import { NAMES, matchName } from "/names.js";
const { days, hr, valid, label, LEAGUE } = window.DRAFT;
const $ = id => document.getElementById(id);
let mine = new Set();
try { const s = JSON.parse(localStorage.getItem("draft-picks") || "{}");
  mine = new Set((s.slots || []).filter(x => valid.has(x))); $("name").value = s.name || ""; } catch (e) {}
// Random id for this browser. The server ties a name to the first device that sends picks for it.
let token = "";
try { token = localStorage.getItem("draft-token") || ""; } catch (e) {}
if (!token) { token = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
  try { localStorage.setItem("draft-token", token); } catch (e) {} }
const save = () => { try { localStorage.setItem("draft-picks",
  JSON.stringify({ name: $("name").value, slots: [...mine] })); } catch (e) {} };

const slots = [], pills = [];
const render = () => {
  slots.forEach(b => b.setAttribute("aria-pressed", mine.has(b.dataset.id)));
  pills.forEach(([b, ids]) => b.setAttribute("aria-pressed", ids.every(id => mine.has(id))));
  $("clear").hidden = !mine.size;
  $("count").textContent = mine.size ? mine.size + (mine.size === 1 ? " time picked" : " times picked") : "No times picked yet";
};
const changed = () => { save(); $("msg").textContent = ""; render(); };
const set = (id, on) => { if (mine.has(id) === on) return; on ? mine.add(id) : mine.delete(id); changed(); };
// A pill selects a whole group of times; tapping it again when they're all on clears them.
const pill = (text, ids) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "pick"; b.textContent = text;
  b.onclick = () => { const on = !ids.every(id => mine.has(id));
    ids.forEach(id => on ? mine.add(id) : mine.delete(id)); changed(); };
  pills.push([b, ids]); return b;
};
const ids = (day, hour) => days.filter(day).flatMap(d => d.hours.filter(hour).map(h => d.key + "-" + h));

const quick = $("quick");
[["Weeknights", d => !d.weekend, () => true],
 ["Weekend afternoons", d => d.weekend, h => h < 17],
 ["Weekend nights", d => d.weekend, h => h >= 17],
 ["Everything", () => true, () => true]].forEach(([text, day, hour]) => {
  const list = ids(day, hour); if (list.length) quick.appendChild(pill(text, list));
});
const clear = document.createElement("button"); clear.type = "button"; clear.id = "clear";
clear.className = "pick clear"; clear.textContent = "Clear";
clear.onclick = () => { mine.clear(); changed(); };
quick.appendChild(clear);

const wrap = $("days");
days.forEach(d => {
  const row = document.createElement("div"); row.className = "day";
  const head = document.createElement("div"); head.className = "dhead";
  const nm = document.createElement("span"); nm.className = "dname"; nm.textContent = d.dow;
  const sm = document.createElement("small"); sm.textContent = d.label; nm.appendChild(sm);
  const all = pill("All", d.hours.map(h => d.key + "-" + h));
  all.setAttribute("aria-label", "All times " + d.dow + " " + d.label);
  head.append(nm, all);
  // Back-to-back hours share a line; a gap (afternoon to night) starts a new one.
  const times = document.createElement("div"); times.className = "times";
  let run = 0, cols = 0;
  d.hours.forEach((h, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "slot";
    b.dataset.id = d.key + "-" + h; b.textContent = hr(h);
    if (i && h - d.hours[i - 1] > 1) { b.style.gridColumnStart = 1; run = 0; }
    cols = Math.max(cols, ++run);
    slots.push(b); times.appendChild(b);
  });
  times.style.setProperty("--cols", cols);
  row.append(head, times); wrap.appendChild(row);
});

// Tap toggles one time. Swiping sideways paints every time the finger crosses, on or off to match the first one.
let paint = null, skipClick = false;
wrap.addEventListener("pointerdown", e => {
  const b = e.target.closest(".slot"); skipClick = false;
  paint = b ? { x: e.clientX, first: b.dataset.id, on: !mine.has(b.dataset.id), moved: false } : null;
});
wrap.addEventListener("pointermove", e => {
  if (!paint) return;
  if (!paint.moved) { if (Math.abs(e.clientX - paint.x) < 10) return; paint.moved = true; set(paint.first, paint.on); }
  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest(".slot");
  if (b) set(b.dataset.id, paint.on);
});
const endPaint = () => {
  if (paint && paint.moved) { skipClick = true; setTimeout(() => skipClick = false, 300); }
  paint = null;
};
addEventListener("pointerup", endPaint);
addEventListener("pointercancel", endPaint);
wrap.addEventListener("click", e => {
  const b = e.target.closest(".slot"); if (!b) return;
  if (skipClick) { skipClick = false; return; }
  set(b.dataset.id, !mine.has(b.dataset.id));
});
// Only roster names count. A typo is corrected in place once the field loses focus; anything else gets a hint.
NAMES.forEach(n => $("roster").appendChild(new Option(n)));
// A wrong name turns the field red with the reason right under it; when it could be a few people, they're one tap away.
const nameError = (text, choices = []) => {
  const err = $("nameErr"); err.textContent = text; err.hidden = !text;
  $("name").classList.toggle("bad", !!text); $("name").setAttribute("aria-invalid", !!text);
  choices.forEach(n => { const b = document.createElement("button"); b.type = "button"; b.className = "pick"; b.textContent = n;
    b.onclick = () => { $("name").value = n; fixName(); }; err.appendChild(b); });
};
const fixName = () => {
  const typed = $("name").value.trim(), m = matchName(typed);
  if (m.name) $("name").value = m.name;
  if (!typed || m.name) nameError("");
  else if (m.close.length) nameError("Which one are you?", m.close);
  else nameError("⚠ “" + typed + "” isn't on the league list. Check the spelling.");
  $("msg").textContent = "";
  save(); return m;
};
// Stars the three most picked times so far (plus any tied with third) so everyone knows which to prioritize.
// A time needs at least two people before it counts.
const showLeaders = ({ teams, counts }) => {
  const n = b => counts[b.dataset.id] || 0;
  const cut = Math.max(2, slots.map(n).sort((x, y) => y - x)[2] || 0);
  slots.forEach(b => {
    const lead = n(b) >= cut; let s = b.querySelector("small");
    b.classList.toggle("lead", lead);
    if (lead && !s) s = b.appendChild(document.createElement("small"));
    if (lead) s.textContent = "★ " + n(b) + " of " + teams; else if (s) s.remove();
  });
  $("leadKey").hidden = !slots.some(b => n(b) >= cut);
};
const loadStandings = async () => {
  const r = await fetch("/api/standings");
  if (!r.ok) throw new Error("Load failed");
  const s = await r.json(); showLeaders(s); return s;
};
loadStandings().catch(() => {});
$("name").oninput = () => { nameError(""); save(); };
$("name").onchange = fixName;
if ($("name").value) fixName();
render();

$("confirm").onclick = async () => {
  const msg = $("msg");
  const { name } = fixName();
  if (!name) {
    if (!$("name").value.trim()) nameError("⚠ Add your name first.");
    msg.className = "note err"; msg.textContent = "Fix your name first.";
    $("name").scrollIntoView({ block: "center" }); $("name").focus({ preventScroll: true }); return;
  }
  msg.className = "note";
  if (!mine.size) { msg.textContent = "Pick at least one time."; return; }
  $("confirm").disabled = true; msg.textContent = "Saving...";
  try {
    const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, slots: [...mine], token }) });
    if (!r.ok) throw Object.assign(new Error("Save failed"),
      { reason: r.status < 500 && (await r.json().catch(() => ({}))).error });
    msg.textContent = "";
    showStandings();
  } catch (e) {
    msg.className = "note err";
    msg.textContent = e.reason || "Couldn't save right now. Try again in a minute.";
  } finally { $("confirm").disabled = false; }
};

// After a save: swap the picker for the league-wide tally, most picked times first.
const view = after => { $("picker").hidden = $("dock").hidden = after; $("after").hidden = !after; scrollTo(0, 0); };
async function showStandings() {
  const note = $("inCount"), best = $("best");
  note.className = "note done"; note.textContent = "You're in. Loading the top times..."; best.textContent = "";
  view(true);
  try {
    const { teams, counts } = await loadStandings();
    note.textContent = "You're in. " + teams + " of " + LEAGUE + " teams have picked.";
    Object.keys(counts).filter(id => valid.has(id))
      .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).slice(0, 5).forEach(id => {
        const li = document.createElement("li");
        const b = document.createElement("b"); b.textContent = label(id);
        const ct = document.createElement("span"); ct.className = "ct"; ct.textContent = counts[id] + " of " + teams;
        const o = document.createElement("span"); o.className = "out" + (mine.has(id) ? " yours" : "");
        o.textContent = mine.has(id) ? "You picked this" : "Not one of your picks";
        li.append(b, ct, o); best.appendChild(li);
      });
  } catch (e) {
    note.textContent = "You're in. Couldn't load the top times right now.";
  }
}
$("edit").onclick = () => view(false);
</script>
</body>
</html>
